<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection Demo</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeo5gC5pTQ3U9mKxK7E2Q6pK8G9v3zG8y3jVh5f1M6WzK5U6" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            margin-top: 2rem;
        }

        .result {
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="mt-4 text-center">Fraud Detection Demo</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <form id="txForm">
                    <div class="mb-3">
                        <label for="transactionId" class="form-label">Transaction ID</label>
                        <input type="text" class="form-control" id="transactionId" name="transaction_id" required>
                    </div>
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                    </div>
                    <div class="mb-3">
                        <label for="currency" class="form-label">Currency</label>
                        <input type="text" class="form-control" id="currency" name="currency" value="USD" required>
                    </div>
                    <div class="mb-3">
                        <label for="timestamp" class="form-label">Timestamp (ISO)</label>
                        <input type="datetime-local" class="form-control" id="timestamp" name="timestamp" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Evaluate Transaction</button>
                </form>
                <div id="result" class="result d-none">
                    <h4 class="mt-4">Result</h4>
                    <pre class="bg-light p-3" id="resultJson"></pre>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+6l0M8mGkM9V4Yp4Z9Wf4b8S2X0w6"
        crossorigin="anonymous"></script>
    <script>
        const form = document.getElementById('txForm');
        const resultDiv = document.getElementById('result');
        const resultJson = document.getElementById('resultJson');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                transaction_id: form.transaction_id.value,
                amount: parseFloat(form.amount.value),
                currency: form.currency.value,
                timestamp: new Date(form.timestamp.value).toISOString()
            };
            try {
                const resp = await fetch('/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const json = await resp.json();
                resultJson.textContent = JSON.stringify(json, null, 2);
                resultDiv.classList.remove('d-none');
            } catch (err) {
                resultJson.textContent = 'Error: ' + err;
                resultDiv.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
